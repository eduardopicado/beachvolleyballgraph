<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Description, canonical, Open Graph and JSON-LD are injected per page by
      ingest/prerender.ts at build time, then kept in sync client-side by
      App.tsx. Do not add them here — every prerendered page would carry two.
      The title below is a fallback; prerender replaces it per page.
    -->
    <title>Beach Volleyball Partnership Graph</title>
    <!--
      Portraits come from FIVB's image service, which is a different origin and
      is not touched until a reader opens a player. The first one therefore pays
      for a DNS lookup, a TCP connection and a TLS handshake before its request
      is even sent: measured against sharp.fivb.com, the handshake alone is
      170-320ms and the whole first fetch 220-720ms, against 50-400ms once the
      connection exists. Warming it while the page loads takes that out of the
      critical path of the first click.

      No `crossorigin`: an <img> without that attribute is fetched in no-CORS
      mode, and a preconnect that does not match the mode of the request that
      follows opens a connection nothing reuses. (Fonts are the case that needs
      it; images are not.)
    -->
    <link rel="preconnect" href="https://sharp.fivb.com" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
