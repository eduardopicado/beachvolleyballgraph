### Daily rebuild + publish to Cloudflare Pages.
#
# Alternative to deploy.yml (GitHub Pages). Use this one when the site is served
# from a custom domain behind Cloudflare. Disable the other workflow so the two
# do not both rebuild on the same schedule.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard URL
# Required repository variable:
#   SITE_URL                e.g. https://beachvolley.com.br  (no trailing slash)
#
# SITE_URL matters: canonical tags, Open Graph URLs and sitemap.xml are baked in
# at build time, so a wrong value publishes wrong canonicals.

name: Rebuild data and deploy (Cloudflare)

on:
  schedule:
    # Daily at 09:17 UTC — see deploy.yml for why daily and why that hour.
    # Keep the two in step: whichever host is live, the data is the same data.
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ingest, build and publish in one job — see deploy.yml for why every job
    # in this repository is bounded rather than left on the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/static-checks

      - name: Fetch FIVB data and build graphs
        run: npm run ingest
        env:
          # Identify the job to FIVB, contact address included, so a free
          # service with a problem can email us rather than null-route us.
          # Points at /about/ rather than the repo — same contact address plus
          # attribution and the not-affiliated disclaimer, and it survives the
          # repo going private. Keep in step with SITE_URL and CONTACT_EMAIL in
          # web/src/site.ts.
          VIS_USER_AGENT: 'beachvolleyballgraph/1.0 (+https://beachvolleyball.com.br/about/; beachgraph@picado.com.br)'

      - name: Build site
        run: npm run build
        env:
          # Cloudflare Pages serves from the domain root.
          BASE_PATH: /
          SITE_URL: ${{ vars.SITE_URL }}

      # Before publishing, never after: a build that does not render must not
      # reach the CDN. This is the only check that sees the freshly fetched
      # data — the scheduled ingest rewrites every graph file with no pull
      # request and no review.
      - uses: ./.github/actions/smoke-test
        with:
          base_path: /
          site_url: ${{ vars.SITE_URL }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=beachvolleyballgraph
