### Daily rebuild + publish.
#
# Three jobs, in a strict pipeline: fetch the FIVB archive and rebuild every
# graph from scratch (ingest), compile the site around that data (build), then
# publish it (deploy). A full rebuild takes about a minute, which is cheap
# enough that there is no incremental cache to go stale — any upstream
# correction or ingest bug is washed out by the next run.
#
# `ingest` commits the refreshed data straight to `web/public/v1/` on this
# branch (see the header comment in ingest/main.ts for why it's tracked at
# all) rather than handing it to `build` as a short-lived artifact. That has
# two consequences here:
#
# - On a `push` to main that isn't itself a data refresh — a code change, with
#   nothing to fetch — `ingest` is skipped entirely (`if:` below) and `build`
#   works from whatever is already committed. FIVB being unreachable, rate
#   limiting this project, or disappearing outright no longer blocks shipping
#   code that has nothing to do with the data.
# - `build` checks out the exact commit `ingest` produced
#   (`needs.ingest.outputs.data_sha`) rather than the ref this run started on,
#   since `ingest`'s own push landed after that. On a code push there is no
#   such output, so it falls back to `github.sha` — the commit already
#   carries whatever data was last committed.
#
# ingest is still split into its own job so that a failure anywhere downstream
# — a bad Pages permission, a broken build step — can be retried with GitHub's
# "re-run failed jobs" without re-fetching from FIVB: `data_sha` is a job
# output, and GitHub preserves a successful job's outputs across a re-run of
# only what failed.
#
# Failure semantics: if ingest fails — including refusing to publish a rebuild
# that looks like a broken fetch rather than a real change, see
# ingest/regression.ts — the job stops before committing, before build and
# before deploy, so the previously published site keeps serving yesterday's
# data. Degraded to "slightly stale", never to "down".

name: Rebuild data and deploy

on:
  schedule:
    # Daily at 09:17 UTC. Off the hour to avoid the cron stampede.
    #
    # 09:17 because the data is not finished when the tournament is. A
    # placement reaches VIS only once someone publishes it: BPT Futures Busan
    # finished with every match recorded and every team still at `Rank 0` —
    # the pair who took bronze read as "has not played" — and the placements
    # appeared several hours later. The archive spans every time zone, so an
    # evening final in the Americas ends around 01:00-04:00 UTC the next day;
    # 09:17 clears those and gives FIVB the European morning to publish. That
    # argument was originally written for Monday, but it is about the hour and
    # holds for any day.
    #
    # Daily rather than weekly because two parts of the archive move faster
    # than a week. Entry lists change every day up to the registration
    # deadline — Alanya gained a men's and a women's team between two runs six
    # hours apart — and they are the whole content of a page for an event that
    # has not been played. Results are the other: a placement FIVB published
    # just after a Monday run waited a full week for the next one, and the
    # Monday runs show that backlog arriving in one go — 79-122 files changed,
    # against the 1-9 of a mid-week run.
    #
    # Cheap enough not to need thinking about. A run is ~3m45s, of which the
    # FIVB fetch is 14s and the browser suite 2m20s; the repository is public,
    # so GitHub-hosted minutes are free. Were it private, the whole schedule
    # would be ~150 of the 2,000 minutes GitHub Free includes — the pull
    # request CI, at ~627, is the bill that would matter.
    #
    # `manifest.generatedAt` moves on every run, so a quiet day still commits
    # a timestamp. That is wanted, not tolerated: the site prints "Data as of
    # {generatedAt}", and a daily bump is it saying truthfully that it looked.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      allow_data_regression:
        description: >-
          Publish even if tournaments/players/partnerships drop more than 5%
          from what's already committed. The schedule never sets this —
          it exists for a deliberate, reviewed correction (e.g. a tier
          reclassification) that legitimately shrinks the dataset, which
          ingest/regression.ts would otherwise refuse on the assumption that a
          drop that size means FIVB handed back a broken response. The drop is
          logged either way.
        type: boolean
        default: false
  push:
    branches: [main]

# Allow one publish at a time; don't cancel a run that is mid-deploy.
#
# That patience is only safe because every job below sets `timeout-minutes`.
# GitHub's default job limit is six hours, and with `cancel-in-progress: false`
# a single wedged step holds the `pages` lock for all of it: queued runs pile
# up behind it, and GitHub keeps only the newest pending run per group, so the
# ones in between are cancelled outright. That is not hypothetical — a
# `playwright install` that hung took the deploy pipeline down for two hours
# and silently dropped a merge's run on the floor. The bounds below are what
# turn "wedged" into "fails and lets the next one through".
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ingest:
    # Skipped on a plain code push: nothing to fetch, and the committed data
    # already reflects the last successful refresh.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # A full rebuild is ~15s of FIVB time; the rest is npm ci and the static
    # checks. Generous enough that a slow day at VIS is not a failure, tight
    # enough that an unanswered socket is.
    timeout-minutes: 25
    permissions:
      contents: write # to commit the refreshed data back to this branch
    outputs:
      data_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/static-checks

      - name: Fetch FIVB data and build graphs
        run: npm run ingest
        env:
          # Identify the job to FIVB, contact address included, so a free
          # service with a problem can email us rather than null-route us.
          # Points at /about/ rather than the repo — same contact address plus
          # attribution and the not-affiliated disclaimer, and it survives the
          # repo going private. Keep in step with SITE_URL and CONTACT_EMAIL in
          # web/src/site.ts.
          VIS_USER_AGENT: 'beachvolleyballgraph/1.0 (+https://beachvolleyball.com.br/about/; beachgraph@picado.com.br)'
          # false on every trigger except a manual dispatch with the checkbox
          # ticked — schedule and workflow_dispatch runs that leave it
          # unchecked, and push (which skips this job entirely), all get 'false'.
          ALLOW_DATA_REGRESSION: ${{ github.event.inputs.allow_data_regression == 'true' }}

      - name: Summarise the published dataset
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.load(open('web/public/v1/manifest.json'))
          print("## Dataset rebuilt\n")
          print(f"- Generated: `{m['generatedAt']}`")
          print(f"- Seasons: {m['seasons']['from']}–{m['seasons']['to']}")
          print(f"- Tournaments: {m['totals']['tournaments']:,}")
          print(f"- Players: {m['totals']['players']:,}")
          print(f"- Partnerships: {m['totals']['partnerships']:,}")
          print(f"- Countries published: {len(m['countries'])}\n")
          print("| Tier | Tournaments |\n|---|---:|")
          for tier, n in sorted(m['tiers'].items(), key=lambda kv: -kv[1]):
              print(f"| {tier} | {n:,} |")
          PY

      # If branch protection on main blocks a direct push even from Actions,
      # this step fails here (before build/deploy run) and the fix is either
      # an actor exemption for github-actions[bot] on the required-PR rule, or
      # switching this to open a small auto-mergeable PR instead (e.g.
      # peter-evans/create-pull-request) — not to relax protection generally.
      - name: Commit refreshed data
        id: commit
        env:
          ALLOW_DATA_REGRESSION: ${{ github.event.inputs.allow_data_regression == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- web/public/v1)" ]; then
            echo "No data changes to commit."
          else
            suffix=""
            if [ "$ALLOW_DATA_REGRESSION" = "true" ]; then
              suffix=" [regression check bypassed — see run log for what shrank]"
            fi
            git add web/public/v1
            git commit -m "Refresh FIVB data ($(date -u +%Y-%m-%d))$suffix"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: ingest
    # Runs whether ingest actually ran (schedule/dispatch) or was skipped (a
    # code-only push) — only a real ingest *failure* should stop the deploy.
    if: always() && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped')
    runs-on: ubuntu-latest
    # Install, build, prerender 265 pages and run the browser suite: ~6 minutes
    # when healthy.
    timeout-minutes: 20
    outputs:
      generated_at: ${{ steps.stamp.outputs.generated_at }}
      bundle: ${{ steps.stamp.outputs.bundle }}
      site_url: ${{ steps.origin.outputs.site_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit ingest just produced, if it ran; otherwise the pushed
          # commit this run started from, which already carries whatever data
          # was last committed.
          ref: ${{ needs.ingest.outputs.data_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Canonical URLs, Open Graph and sitemap.xml are baked in at build time,
      # as are asset URLs and every internal link. Both follow from the
      # SITE_URL repository variable — see .github/actions/site-origin for why
      # they are derived together rather than set independently.
      - id: origin
        uses: ./.github/actions/site-origin
        with:
          site_url: ${{ vars.SITE_URL }}

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.origin.outputs.base_path }}
          SITE_URL: ${{ steps.origin.outputs.site_url }}

      # Belt and braces. The custom domain is configured in Settings > Pages
      # and that setting is what actually serves the site; this file keeps a
      # deploy from clearing it, which is a documented failure mode when the
      # published artifact has no CNAME. Generated rather than committed to
      # web/public/ on purpose: a static file would attach the domain to Pages
      # the first time it shipped, which — before DNS resolves — takes the
      # live site down instead of moving it.
      - name: Keep the custom domain attached
        if: steps.origin.outputs.custom_domain != ''
        env:
          CUSTOM_DOMAIN: ${{ steps.origin.outputs.custom_domain }}
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME

      # Runs *before* the artifact is uploaded, so a build that doesn't render
      # never reaches Pages and the previously published site keeps serving —
      # the same "degraded to slightly stale, never down" stance as the ingest
      # failure path above.
      #
      # This is the only check that sees the freshly fetched data. CI covers
      # code changes on a pull request, but the scheduled ingest rewrites every
      # graph file with no pull request and no review: a shape change there
      # can break rendering with nothing else in the pipeline looking. The
      # regression guard counts rows; this one loads the page.
      - uses: ./.github/actions/smoke-test
        with:
          base_path: ${{ steps.origin.outputs.base_path }}
          site_url: ${{ steps.origin.outputs.site_url }}

      # Hand the deploy job two fingerprints of what it is about to publish.
      #
      # Two, because neither alone is enough. `generatedAt` only moves when the
      # data does, so on a code-only push (ingest skipped) it already matches
      # what is live — a deploy that shipped nothing would still pass, which is
      # exactly the failure this check exists to catch. The hashed bundle name
      # is the complement: it moves whenever the code does, and not at all when
      # only the data changes. Between them every real deploy changes at least
      # one, and the check below requires both to match.
      #
      # The bundle name is a *content* hash, so a change that minifies away —
      # a comment, reformatting — leaves it identical. That is not a gap: the
      # published artifact really is byte-for-byte the same, so there is no
      # no-op deploy to distinguish from a correct one.
      - name: Record what this build should publish
        id: stamp
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, pathlib
          print("generated_at=" + json.load(open('web/public/v1/manifest.json'))['generatedAt'])
          html = pathlib.Path('dist/index.html').read_text(encoding='utf-8')
          m = re.search(r'src="[^"]*/(assets/index-[^"]+\.js)"', html)
          if not m:
              raise SystemExit('no hashed bundle found in dist/index.html')
          print("bundle=" + m.group(1))
          PY

      # `enablement` switches Pages on through the API when it is not already
      # enabled, so a fresh clone or fork deploys without anyone having to visit
      # the settings page first. Relies on the `pages: write` permission above.
      # If this fails with "Resource not accessible by integration" even
      # though that permission is granted here, check Settings > Actions >
      # General > Workflow permissions — a repository- or organisation-level
      # default of "Read repository contents permission" (read-only) silently
      # caps every workflow's token below what its own `permissions:` block
      # asks for.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # Explicit, for the same reason build has its own override above: the
    # default success() considers the whole transitive job graph, not just
    # this job's direct needs, so ingest being skipped (a code-only push) was
    # enough to skip this job too even though build itself had just succeeded
    # — caught live: two merges in a row built fine and never deployed.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Publish plus the propagation check below, which is bounded by its own
    # six attempts at 15s.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Deliberately thin, and deliberately not the browser suite: nothing here
      # can roll anything back, the identical bytes were already exercised
      # pre-upload, and a long assertion against a CDN mid-propagation is a
      # flake generator. This answers one question the localhost runs
      # structurally cannot — did the build we just published actually become
      # the thing being served? Caught live once already: two merges in a row
      # reported success while Pages kept serving the previous build.
      - name: Verify Pages is serving this build
        env:
          EXPECTED_DATA: ${{ needs.build.outputs.generated_at }}
          EXPECTED_BUNDLE: ${{ needs.build.outputs.bundle }}
          EXPECTED_ORIGIN: ${{ needs.build.outputs.site_url }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          if [ -z "$EXPECTED_DATA" ] || [ -z "$EXPECTED_BUNDLE" ]; then
            echo "::warning::Build job published no fingerprints — cannot verify the deploy."
            exit 0
          fi

          # Is Pages even serving from the origin this build was compiled for?
          #
          # This is the one moment the custom-domain cutover can go wrong, and
          # it is invisible to everything else. Setting the SITE_URL variable
          # moves the build to the domain root; attaching the domain in
          # Settings > Pages is what actually moves the *site*. Do the first
          # without the second and Pages keeps serving /<repo>/ while every
          # asset URL points at /assets/… — a blank page whose HTML, manifest
          # and bundle name all still check out below. Order matters, so make
          # the wrong order fail here rather than in a reader's browser.
          case "$PAGE_URL" in
            "$EXPECTED_ORIGIN"|"$EXPECTED_ORIGIN"/*) ;;
            *)
              echo "::error::Built for $EXPECTED_ORIGIN but Pages is serving $PAGE_URL."
              echo "::error::Attach the custom domain in Settings > Pages first, then set the SITE_URL variable."
              exit 1
              ;;
          esac
          echo "Expecting data=$EXPECTED_DATA and bundle=$EXPECTED_BUNDLE at $PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            live_data=$(curl -fsS --max-time 20 "${PAGE_URL}v1/manifest.json" \
                        | python3 -c 'import json,sys; print(json.load(sys.stdin)["generatedAt"])' 2>/dev/null || true)
            # Cache-bust: a CDN edge holding the previous index.html is the very
            # thing being tested for, so don't let it answer from cache.
            live_html=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
                        "${PAGE_URL}?deploycheck=${GITHUB_RUN_ID}" 2>/dev/null || true)

            data_ok=false; bundle_ok=false
            [ "$live_data" = "$EXPECTED_DATA" ] && data_ok=true
            case "$live_html" in *"$EXPECTED_BUNDLE"*) bundle_ok=true ;; esac

            if [ "$data_ok" = true ] && [ "$bundle_ok" = true ]; then
              echo "Live site is serving this build (data $live_data, bundle $EXPECTED_BUNDLE)."
              exit 0
            fi
            echo "attempt $attempt: data_ok=$data_ok bundle_ok=$bundle_ok; waiting for propagation"
            sleep 15
          done
          echo "::error::Pages is not serving the build that just deployed."
          echo "::error::expected data=$EXPECTED_DATA got=${live_data:-<unreachable>}; expected bundle=$EXPECTED_BUNDLE (not found in live HTML)"
          exit 1
