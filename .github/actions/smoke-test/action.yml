### Browser smoke tests against the built site.
#
# Install the browser, run Playwright, keep the report when it fails. The same
# three steps every publishing path needs, in one place — the version that
# lived only in ci.yml and deploy.yml is why deploy-cloudflare.yml had no
# browser check at all.
#
# `base_path` and `site_url` must match what the site was *built* with, or
# `vite preview` serves 404s and every test fails for a reason that has
# nothing to do with the page. Both come from .github/actions/site-origin in
# the callers that have a choice about it.
#
# Expects `dist/` to already exist: this runs after the build, deliberately
# before anything publishes it, so a build that does not render never reaches
# the CDN.

name: Smoke test
description: Install Chromium and run the Playwright suite against the built site.

inputs:
  base_path:
    description: The path the site was built to be served from.
    required: false
    default: /
  site_url:
    description: The public origin the site was built with.
    required: false
    default: ''
  report_name:
    description: Artifact name for the Playwright report, so two callers in one workflow do not collide.
    required: false
    default: playwright-report

runs:
  using: composite
  steps:
    # Bounded, and retried once.
    #
    # This step hung for 1h44m on a deploy — a browser download that never
    # finished and never failed. Because deploy.yml serialises on a `pages`
    # concurrency group, that one wedged download blocked every subsequent
    # merge from publishing and cost one queued run outright.
    #
    # `timeout-minutes:` is not supported on steps inside a composite action
    # (actions/runner#1979), so the bound has to be coreutils `timeout` rather
    # than something the runner enforces. The retry is because the failure it
    # guards against — a stalled CDN fetch — is exactly the kind that succeeds
    # on a second attempt, and a red deploy for a network blip trains people
    # to re-run without reading.
    #
    # The retry has to clear apt first, and that is not incidental. `--with-deps`
    # shells out to `apt-get` as root; `timeout` kills the `npx` process it can
    # see, not the root-owned grandchild, which is left holding
    # /var/lib/apt/lists/lock. The retry then dies in under two seconds with
    # "Could not get lock ... held by process N (apt-get)" — so the guard failed
    # every time it was actually needed. Observed on run 32158148540: the Azure
    # Ubuntu mirror went unreachable, apt sat retrying until the 8m bound, and
    # the retry never had a chance.
    - name: Install Playwright browser
      shell: bash
      run: |
        install() { timeout -k 30s 8m npx playwright install --with-deps chromium; }

        apt_busy() { pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1; }

        if install; then exit 0; fi

        echo "::warning::Playwright install failed or stalled; retrying once."

        # Kill what the timeout orphaned, then wait for the lock to actually be
        # released — SIGTERM to apt-get is not instant, and racing it just
        # reproduces the same lock error.
        #
        # apt-get only, never dpkg: the hang this guards against is `apt-get
        # update` sitting on an unreachable mirror while holding the lists lock,
        # and killing a dpkg that is genuinely mid-transaction would turn a
        # recoverable stall into a broken package database.
        sudo pkill -x apt-get || true
        for _ in $(seq 1 30); do
          apt_busy || break
          sleep 2
        done
        if apt_busy; then
          echo "::warning::apt still busy after 60s; retrying anyway."
        fi
        # No-op unless the killed run left something half-configured.
        sudo dpkg --configure -a || true

        install

    - name: Smoke test the built site
      shell: bash
      run: npm run test:e2e
      env:
        BASE_PATH: ${{ inputs.base_path }}
        SITE_URL: ${{ inputs.site_url }}

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report_name }}
        path: playwright-report/
        retention-days: 7
